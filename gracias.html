<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikonos Luthier - Gracias</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .gracias-seccion {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .gracias-caja {
            max-width: 500px;
        }
        .gracias-icono {
            font-size: 60px;
            color: var(--acento);
            margin-bottom: 20px;
        }
        .gracias-titulo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--texto);
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .gracias-texto {
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            color: var(--texto-oscuro);
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .gracias-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <header class="header-principal">
        <nav class="nav-principal contenedor-flex">
            <div class="contenedor-logo">
                <img src="img/logo.png" alt="Mikonos Luthier" class="logo-img">
                <h1 class="logo"><a href="index.html" class="logo-link">Mikonos Luthier</a></h1>
            </div>
        </nav>
    </header>

    <main>
        <section class="gracias-seccion">
            <div class="gracias-caja">
                <div class="gracias-icono">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 class="gracias-titulo">Mensaje enviado</h2>
                <p class="gracias-texto">
                    Gracias por contactar a Mikonos Luthier.
                    Recibimos tu consulta y te responderemos
                    a la brevedad posible.
                </p>
                <div class="gracias-links">
                    <a href="index.html" class="btn">Volver al inicio</a>
                    <a href="galeria.html" class="btn">Ver galeria</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer-principal">
        <div class="copy"><i class="fa fa-copyright"></i> Copyright - 2026 Mikonos Luthier</div>
    </footer>

</body>
</html>
